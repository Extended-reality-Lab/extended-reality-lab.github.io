<header role="banner">
	<div class="header-nav">
		<h1 class="site-name">{{ site.title }}</h1>
		{% include navigation.html %}
	</div>
	<div class="page-header">
		<h1 class="project-name">{{ page.title }}</h1>
		<h2 class="project-tagline">{{ page.description }}</h2>
		{% assign references = site.data.head-references[page.head-references] %}

		{% for item in references %}
		<a href="{{ item.link }}" class="btn">{{ item.name }}</a>
		{% endfor %}
	</div>
</header>
