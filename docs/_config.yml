title: OSU's Extended Reality Lab
description: Oregon State University's Extended Reality Lab
google_analytics:
theme: jekyll-theme-cayman
source: docs

a-frame_version: https://aframe.io/releases/1.7.0/aframe.min.js

collections_dir: collections
collections:
  authors:
    output: true
  projects:
    output: true
    permalink: /:collection/:name
  staff:
    output: true
    permalink: /:collection/:name
  sponsors:
    output: true
  xr-environments:
    output: true
    permalink: /xr/:name
  aframe-unique:
    output: false
    permalink: /xr/:name/components

defaults:
- scope:
    path: ""
    type: "authors"
  values:
    layout: "author"
- scope:
    path: ""
    type: "xr-environments"
  values:
    aframe: "true"
- scope:
    path: ""
    type: "posts"
  values:
    layout: "post"
- scope:
    path: ""
    type: "posts"
  values:
    layout: "post"
- scope:
    path: ""
    type: "projects"
  values: 
    layout: "project"
- scope:
    path: ""
    type: "staff"
  values: 
    layout: "staff"
    title: Staff | :name
- scope:
    path: ""
    type: "sponsors"
  values:
    layout: "sponsor"
- scope:
    path: ""
  values:
    layout: "default"
    head-references: ""
    aframe: ""
    aframeAddons: ""
    aframeComponents: ""
    aframeUniqueComponents: ""
    headadd: ""