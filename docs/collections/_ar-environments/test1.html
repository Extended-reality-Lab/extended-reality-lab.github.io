---
title: AR Test
description: An example where an object is visible in AR
aframe: true
layout: default
---
<a-scene reflection="directionalLight: a-light[type=directional]"
         ar-hit-test="target: #inverter;"
         renderer="colorManagement: true; exposure: 1; toneMapping: ACESFilmic"
         shadow="type: pcfsoft"
         xr-mode-ui="XRMode: xr">
    <a-assets>
        <a-asset-item id="DecimatedInverter-1-gltf" src="/assets/a-frame/models/test1/DecimatedInverter 1.gltf"></a-asset-item>
    </a-assets>

    <a-light type="directional" light="castShadow:true;" position="1 1 1" intensity="1.57" shadow-camera-automatic="#objects"></a-light>
    <a-camera position="0 0.4 0" wasd-controls="acceleration:10;"></a-camera>

    <!-- gltf entities -->
    <a-entity id="inverter" gltf-model="#DecimatedInverter-1-gltf" position="0 0.5 -1.2" rotation="0 -90 0" scale="0.08 0.08 0.08" animation-mixer></a-entity>

    <a-plane follow-shadow="#objects" material="shader:shadow" shadow="cast:false;" rotation="-90 0 0" width="2" height="2"></a-plane>
    <a-sky color="#ECECEC" hide-on-enter-ar></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" color="#20AA20"></a-plane>

</a-scene>
