---
title: AR Test
description: An example where an object is visible in AR
headadd: "
<script>
    AFRAME.registerComponent('follow-shadow', {
        schema: { type: 'selector' },
        init() { this.el.object3D.renderOrder = -1; },
        tick() {
            if (this.data) {
                this.el.object3D.position.copy(this.data.object3D.position);
                this.el.object3D.position.y -= 0.001; // stop z-fighting
            }
        }
    });
</script>
<script src='https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js'></script>
"
---
<!-- Scene & Assets -->
<a-scene reflection="directionalLight: a-light[type=directional]"
         ar-hit-test="target: #inverter;"
         renderer="colorManagement: true; exposure: 1; toneMapping: ACESFilmic"
         shadow="type: pcfsoft"
         xr-mode-ui="enabled: true; enterAREnabled: true; XRMode: xr"
         webxr="requiredFeatures: hit-test,local-floor;
             optionalFeatures: dom-overlay, unbounded"
         embedded arjs>

    <a-assets>
        <a-asset-item id="DecimatedInverter-1-gltf" src="/assets/a-frame/models/test1/decimated_inverter/DecimatedInverter 1.gltf"></a-asset-item>
    </a-assets>

    <!-- Lighting -->

    <a-light type="directional" light="castShadow:true;" position="1 1 1" intensity="1.57" shadow-camera-automatic="#objects"></a-light>
    
    <!-- Marker-tracking camera for kanji marker -->
    <a-marker-camera preset='kanji' position="0 0.4 0" wasd-controls="acceleration:10;"></a-marker-camera>

    <!-- gltf entities -->
    <a-entity id="inverter" gltf-model="#DecimatedInverter-1-gltf" position="0 -0.04 0" rotation="0 -90 0" scale="0.06 0.06 0.06" animation-mixer shadow></a-entity>

    <a-plane id="shadow" follow-shadow="#inverter" material="shader:shadow" shadow="cast:false;" rotation="-90 0 0" width="2" height="2"></a-plane>
    <a-sky color="#ECECEC" hide-on-enter-ar></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" color="#20AA20" height="10" width="10" hide-on-enter-ar></a-plane>

</a-scene>
