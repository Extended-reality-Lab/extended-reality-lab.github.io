title: OSU's Extended Reality Lab
description: Oregon State University's Extended Reality Lab
google_analytics:
theme: jekyll-theme-cayman

collections_dir: collections
collections:
  authors:
    output: true
  projects:
    output: true
    permalink: /:collection/:name
  staff:
    output: true
    permalink: /:collection/:name

